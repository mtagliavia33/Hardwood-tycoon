<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Galaxy Tycoon — Space Idle Empire</title>
<meta name="description" content="Idle space tycoon: blast ore from your asteroid, launch rocket missions, colonize 12 planets, gamble in deep space, and jump the wormhole for dark matter." />
<style>
:root{
  --bg:#05060f; --panel:#0d1024; --panel2:#151936; --line:#232a55;
  --ink:#eaf0ff; --dim:#8b94c4; --accent:#7c5cff; --accent2:#37e6ff;
  --good:#3ee089; --bad:#ff5d7a; --gold:#ffd166; --ore:#c9a06c; --ice:#9adcff; --fuel:#ff9d5c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:
  radial-gradient(1200px 600px at 15% -10%, rgba(124,92,255,.14), transparent 60%),
  radial-gradient(1000px 500px at 90% 0%, rgba(55,230,255,.08), transparent 60%),
  var(--bg);
  color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow-x:hidden}
button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-weight:700; color:var(--ink)}
button:disabled{opacity:.45; cursor:default}
input,textarea{font-family:inherit}
.wrap{max-width:760px; margin:0 auto; padding:0 12px 90px}
/* ticker */
.tickerbar{position:sticky; top:0; z-index:60; background:#0a0d1f; border-bottom:1px solid var(--line); overflow:hidden; white-space:nowrap; font-size:.78rem; color:var(--accent2); padding:5px 0}
.tickertext{display:inline-block; padding-left:100%; animation:tick 22s linear infinite}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0 4px}
.brand{font-size:1.05rem; font-weight:800; letter-spacing:.3px}
.brand b{color:var(--accent2)}
.acctwrap{position:relative}
.acctbtn{background:var(--panel2); border:1px solid var(--line); padding:7px 10px; font-size:.8rem}
.acctdrop{position:absolute; right:0; top:110%; background:var(--panel); border:1px solid var(--line); border-radius:12px; min-width:230px; z-index:70; box-shadow:0 12px 30px #000a; overflow:hidden}
.acctdrop button{display:block; width:100%; text-align:left; background:none; border-radius:0; padding:11px 14px; font-size:.84rem; border-bottom:1px solid var(--line)}
.acctdrop button:hover{background:var(--panel2)}
.acctdrop button:last-child{border-bottom:none}
/* resource strip */
.resbar{display:flex; gap:6px; flex-wrap:wrap; padding:6px 0 8px; position:sticky; top:27px; z-index:50; background:linear-gradient(180deg, var(--bg) 82%, transparent)}
.res{flex:1; min-width:100px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 9px; font-size:.78rem; color:var(--dim); display:flex; flex-direction:column}
.res b{font-size:.95rem; color:var(--ink)}
.res.dmres b{color:var(--accent)}
/* tabs */
.tabs{display:flex; gap:4px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative; flex:1; min-width:86px; background:var(--panel); border:1px solid var(--line); padding:10px 6px; font-size:.8rem; color:var(--dim); white-space:nowrap}
.tab.on{background:var(--panel2); color:var(--ink); border-color:var(--accent)}
.pip{position:absolute; top:6px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--accent2); box-shadow:0 0 8px var(--accent2)}
/* panels */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px}
.panel h3{font-size:.95rem; margin-bottom:8px}
.dim{color:var(--dim); font-size:.82rem; line-height:1.45}
.fineprint{font-size:.7rem; color:var(--dim); margin-top:6px}
.statrow{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:.86rem; flex-wrap:wrap}
.statrow:last-child{border-bottom:none}
.statrow b{white-space:nowrap}
.primary{background:linear-gradient(180deg, var(--accent), #5537d8); padding:12px 16px; width:100%; font-size:.95rem; box-shadow:0 6px 18px #5537d866}
.ghost{background:var(--panel2); border:1px solid var(--line); padding:10px 14px; font-size:.85rem}
.ghost.mini{padding:5px 9px; font-size:.72rem; border-radius:8px}
.danger{background:linear-gradient(180deg,#ff5d7a,#c22e4d); padding:12px 16px; width:100%}
.btncol{display:flex; flex-direction:column; gap:8px; margin-top:12px}
/* asteroid tap */
.tapzone{display:flex; flex-direction:column; align-items:center; padding:8px 0 2px}
.asteroid{width:140px; height:140px; font-size:5rem; line-height:140px; text-align:center; background:radial-gradient(circle at 35% 30%, #2a2f5a, #0d1024 70%); border:2px solid var(--line); border-radius:50%; user-select:none; transition:transform .05s; box-shadow:0 0 40px #7c5cff33}
.asteroid:active{transform:scale(.93)}
.combo{width:180px; height:8px; background:#0006; border-radius:5px; margin-top:10px; overflow:hidden; border:1px solid var(--line)}
.combo > div{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent2)); width:0%; transition:width .12s}
.floater{position:absolute; font-weight:800; pointer-events:none; animation:floatup .9s ease-out forwards; z-index:40}
@keyframes floatup{0%{opacity:1; transform:translateY(0)}100%{opacity:0; transform:translateY(-60px)}}
/* ships & progress */
.shipcard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:8px}
.shiphead{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.88rem; flex-wrap:wrap}
.prog{height:9px; background:#0006; border-radius:5px; overflow:hidden; margin-top:8px; border:1px solid var(--line)}
.prog > div{height:100%; background:linear-gradient(90deg, var(--fuel), var(--gold))}
.collectbtn{background:linear-gradient(180deg, var(--good), #1e9c5c); animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px #3ee08966}50%{box-shadow:0 0 22px #3ee089cc}}
/* galaxy map */
.sector{margin-bottom:14px}
.sector h4{font-size:.8rem; color:var(--accent2); letter-spacing:1px; margin-bottom:6px}
.planetrow{display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:6px; cursor:pointer}
.planetrow.locked{opacity:.65; cursor:default}
.planetrow .pe{font-size:1.8rem}
.planetrow .pinfo{flex:1; min-width:0}
.planetrow .pname{font-weight:800; font-size:.9rem}
.silobar{height:7px; background:#0006; border-radius:4px; overflow:hidden; margin-top:5px; border:1px solid var(--line)}
.silobar > div{height:100%; background:linear-gradient(90deg, var(--ore), var(--gold))}
/* expedition tiers */
.tiercard{border-radius:12px; padding:11px; margin-top:8px; border:1px solid var(--line); background:var(--panel2); cursor:pointer}
.tiercard.on{outline:2px solid var(--accent)}
.tierhead{display:flex; justify-content:space-between; font-size:.88rem; font-weight:800}
/* tech tree */
.techbr{margin-bottom:12px}
.technode{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-top:6px; font-size:.82rem}
.technode.owned{border-color:var(--good); box-shadow:0 0 10px #3ee08922}
.technode.locked{opacity:.55}
/* crew book */
.crewgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:8px}
.crewcard{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 6px; text-align:center; position:relative}
.crewcard .ce{font-size:1.9rem}
.crewcard .cn{font-size:.66rem; font-weight:800; margin-top:3px; line-height:1.2}
.crewcard .cs{font-size:.6rem; color:var(--dim); margin-top:3px; line-height:1.25}
.crewcard.missing{opacity:.5}
.crewcard.missing .ce{filter:grayscale(1) brightness(.5)}
.crewcard.assigned{border-color:var(--gold)}
/* market */
.spark{width:100%; height:44px}
/* chat (Comms) */
.chatrow{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line); cursor:pointer}
.chatrow:hover{background:var(--panel2)}
.cdot{width:10px; height:10px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); flex:0 0 auto}
.cdot.on{background:var(--good); border-color:var(--good); box-shadow:0 0 8px var(--good)}
.chatbadge{min-width:18px; text-align:center; font-size:.68rem; font-weight:800; background:var(--accent2); color:#012; border-radius:9px; padding:1px 5px}
.chatlog{max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:4px 0}
.bubble{max-width:78%; align-self:flex-start; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:8px 11px; font-size:.9rem; white-space:pre-wrap; word-break:break-word}
.bubble.mine{align-self:flex-end; background:color-mix(in srgb, var(--accent) 25%, var(--panel2)); border-color:var(--accent)}
.bubble .bwhen{display:block; font-size:.62rem; color:var(--dim); margin-top:3px}
.chatbar{display:flex; gap:8px; margin-top:10px}
.chatbar input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 12px; font-size:1rem}
/* modal */
.overlay{position:fixed; inset:0; background:#000a; backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:14px; overflow-y:auto}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; max-width:420px; width:100%; text-align:center; max-height:92vh; overflow-y:auto}
.modal h2{font-size:1.15rem; margin:6px 0}
.modal input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:11px 12px; font-size:1rem; margin-top:8px; text-align:center}
.modal .statrow input{width:130px; margin:0; text-align:right}
.modal textarea{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px 12px; font-size:.95rem; margin-top:8px; resize:vertical}
.msg{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:6px; text-align:left}
.msg.unread{border-color:var(--accent2)}
.msg-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.msg .who{font-weight:700; font-size:.85rem}
.msg .body{font-size:.9rem; white-space:pre-wrap; word-break:break-word; margin-top:2px}
.goalbar{height:14px; background:#0006; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.goalbar > div{height:100%; background:linear-gradient(90deg, var(--good), var(--accent2))}
@media(max-width:520px){ .asteroid{width:112px; height:112px; line-height:112px; font-size:4rem} }
</style>
</head>
<body>
<div class="tickerbar"><span class="tickertext" id="ticker">🚀 Welcome to the galaxy, cadet!</span></div>
<div class="wrap">
  <div class="top">
    <div class="brand" id="brandtxt">🚀 Galaxy <b>Tycoon</b></div>
    <div class="acctwrap">
      <button class="acctbtn" id="acctmenu">👤 <span id="acctlbl">…</span> ▾</button>
      <div class="acctdrop" id="acctdrop" style="display:none">
        <button id="messagebtn">✉️ Message the owner</button>
        <button id="tutorialbtn">🎓 Tutorial</button>
        <button id="renamebtn">Change account name</button>
        <button id="newacctbtn">Make a new account</button>
        <button id="logoutbtn">Log out and save</button>
        <button id="adminbtn">Admin panel</button>
      </div>
    </div>
  </div>

  <div class="resbar">
    <div class="res">⭐ Credits<b id="r-credits">0</b></div>
    <div class="res">⛏️ Ore<b id="r-ore">0</b></div>
    <div class="res">🧊 Ice<b id="r-ice">0</b></div>
    <div class="res">🚀 Fuel<b id="r-fuel">0</b></div>
    <div class="res dmres">🌌 Dark Matter<b id="r-dm">0</b></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="command">🚀 Command</button>
    <button class="tab" data-tab="galaxy">🪐 Galaxy</button>
    <button class="tab" data-tab="deep">🎲 Deep Space</button>
    <button class="tab" data-tab="hub">🛰️ Hub<span class="pip" id="chat-pip" style="display:none"></span><span class="pip" id="crew-pip" style="display:none;right:20px;background:var(--gold);box-shadow:0 0 8px var(--gold)"></span></button>
  </div>

  <main>
    <section id="tab-command">
      <div class="panel" style="text-align:center">
        <div class="tapzone">
          <button class="asteroid" id="tap">🪨</button>
          <div class="combo"><div id="combofill"></div></div>
          <p class="dim" style="margin-top:8px"><b id="tapverb">Fire the mining laser</b> — <b style="color:var(--ore)" id="tapval">+1 ⛏️</b> per blast<span id="combolbl"></span></p>
          <button class="ghost" id="laserup" style="margin-top:8px">🔫 Laser Lv 1 — upgrade</button>
        </div>
      </div>
      <div class="panel" id="quicksell"></div>
      <div class="panel" id="refpanel"></div>
      <div class="panel"><h3>🛎️ Hangar</h3><div id="hangar"></div></div>
    </section>

    <section id="tab-galaxy" style="display:none"><div id="starmap"></div><div id="wormhole"></div></section>

    <section id="tab-deep" style="display:none"><div id="deepspace"></div></section>

    <section id="tab-hub" style="display:none">
      <div class="panel"><h3>🏅 Leaderboards</h3><p class="dim" id="lbnote"></p><div id="lbwrap"></div></div>
      <div class="panel"><h3>📡 Comms</h3><div id="chatwrap"></div></div>
      <div class="panel" id="goalpanel"></div>
      <div class="panel" id="marketpanel"></div>
      <div id="crewbook"></div>
      <div class="panel" id="statspanel"></div>
      <div class="panel">
        <h3>Danger zone</h3>
        <p class="dim">Careful, cadet — these can't be undone.</p>
        <div class="btncol">
          <button class="danger" id="hardreset">Reset my whole empire</button>
          <button class="danger" id="deleteacct" style="display:none">🗑️ Delete my account forever</button>
        </div>
        <p class="dim" style="text-align:center;margin-top:8px" id="savenote"></p>
      </div>
    </section>
  </main>
</div>

<script>
'use strict';
/* ============================ content data =============================== */
// 12 planets across 3 sectors (+ the Wormhole rim). prod = resource/sec at
// Extractor level 1; costs are paid in credits + fuel to colonize.
const PLANETS = [
  { id:'moon',    name:'Moon Cheddar', e:'🌕', sec:0, prod:{ ore:1 },                        cost:{ c:500,   f:3 } },
  { id:'glacio',  name:'Glacio',       e:'🧊', sec:0, prod:{ ice:0.7 },                      cost:{ c:5e3,   f:10 } },
  { id:'rustia',  name:'Rustia',       e:'🔴', sec:0, prod:{ ore:6 },                        cost:{ c:4e4,   f:40 } },
  { id:'plumbo',  name:'Plumbo',       e:'💜', sec:1, prod:{ credits:20 },                   cost:{ c:3e5,   f:150 } },
  { id:'donutus', name:'Donutus',      e:'🍩', sec:1, prod:{ ore:35, ice:14 },               cost:{ c:2e6,   f:500 } },
  { id:'zappia',  name:'Zappia',       e:'⚡', sec:1, prod:{ credits:300 },                  cost:{ c:1.5e7, f:2e3 } },
  { id:'boulder', name:'Boulderon',    e:'🪨', sec:1, prod:{ ore:600 },                      cost:{ c:1e8,   f:8e3 } },
  { id:'furnacia',name:'Furnacia',     e:'🌋', sec:2, prod:{ ore:6e3 },                      cost:{ c:8e8,   f:3e4 } },
  { id:'crystal', name:'Crystallis',   e:'💎', sec:2, prod:{ credits:5e4 },                  cost:{ c:6e9,   f:1e5 } },
  { id:'bubblor', name:'Bubblor',      e:'🫧', sec:2, prod:{ ice:1e4 },                      cost:{ c:5e10,  f:4e5 } },
  { id:'prismara',name:'Prismara',     e:'🌈', sec:2, prod:{ ore:5e4, ice:2e4, credits:2e5 },cost:{ c:4e11,  f:1.5e6 } },
  { id:'umbra',   name:'Umbra',        e:'🕳️', sec:3, prod:{ credits:1e6 },                  cost:{ c:3e12,  f:6e6 }, dmBonus:0.10 },
];
const SECTORS = ['🏠 HOME SYSTEM', '🌆 NEON BELT', '🌌 DEEP REACH', '🕳️ WORMHOLE RIM'];
const SEC_REQ = [0, 3, 6, 9]; // colonies needed to unlock each sector
const pDef = id => PLANETS.find(p => p.id === id);

const SHIPS = [
  { id:'scout',    name:'Scout Hopper',   e:'🛸', cost:0,     cargo:1,   tmult:1,   note:'your trusty starter' },
  { id:'hauler',   name:'Rock Hauler',    e:'🚚', cost:2.5e3, cargo:4,   tmult:1.4, ore:1.2,  note:'+20% ⛏️ hauls' },
  { id:'comet',    name:'Comet Chaser',   e:'🛰️', cost:5e4,   cargo:10,  tmult:0.8, ice:1.3,  note:'+30% 🧊, fast' },
  { id:'freighter',name:'Star Freighter', e:'🚀', cost:1e6,   cargo:40,  tmult:1.2, note:'big and slow' },
  { id:'cruiser',  name:'Nebula Cruiser', e:'🛳️', cost:2.5e7, cargo:90,  tmult:1,   exp:0.10, note:'+10% expedition success' },
  { id:'skiff',    name:'Alien Skiff',    e:'👾', cost:1e9,   cargo:250, tmult:0.6, all:1.05, needArts:3, note:'+5% everything, alien tech' },
];
const sDef = id => SHIPS.find(s => s.id === id);

const MISSIONS = [
  { id:'moonhop', name:'Moon Hop',          e:'🌕', time:30e3,   fuel:1,   rew:{ ore:20, credits:10 },              need:0 },
  { id:'salvage', name:'Satellite Salvage', e:'🛰️', time:120e3,  fuel:3,   rew:{ credits:120 },                     need:1 },
  { id:'comet',   name:'Comet Tail Run',    e:'☄️', time:360e3,  fuel:8,   rew:{ ice:100, ore:20 },                 need:2 },
  { id:'ring',    name:'Ring Sweep',        e:'🪐', time:1200e3, fuel:25,  rew:{ ore:900, ice:350 },                need:3 },
  { id:'yard',    name:'Alien Yard Sale',   e:'👾', time:3600e3, fuel:80,  rew:{ credits:2e4 },                     need:6 },
  { id:'edge',    name:'Edge Survey',       e:'🕳️', time:14400e3,fuel:300, rew:{ ore:8e4, ice:3e4, credits:2e5 },   need:9, artDrop:'monolith', artP:0.03 },
];
const mDef = id => MISSIONS.find(m => m.id === id);

const TIERS = [
  { id:0, name:'Calm Nebula',    e:'🟢', p:0.90, mult:1.5,  time:120e3,  wreck:false },
  { id:1, name:'Asteroid Maze',  e:'🟡', p:0.70, mult:3,    time:300e3,  wreck:false, drops:[['art','horn',0.06]] },
  { id:2, name:'Pirate Belt',    e:'🟠', p:0.50, mult:6,    time:600e3,  wreck:true,  drops:[['crew','sam',0.08],['art','core',0.06]] },
  { id:3, name:'Black Hole Rim', e:'🔴', p:0.30, mult:12,   time:1200e3, wreck:true,  drops:[['crew','gravity',0.08],['art','mirror',0.05]] },
  { id:4, name:'The Void',       e:'🟣', p:0.15, mult:30,   time:1800e3, wreck:true,  drops:[['crew','luna',0.05],['art','crown',0.04]] },
];

const CREW = [
  { id:'nova',   name:'Cadet Nova',           e:'🧑‍🚀', src:'joins you at the start',              hint:'starter',                          eff:'+10% tap yield' },
  { id:'cosmo',  name:'Cosmo the Space Pup',  e:'🐶', src:'complete 10 Moon Hops',                 hint:'fly Moon Hops',                    eff:'ship: −15% mission time', slot:'ship' },
  { id:'bolt',   name:'B0LT-3000',            e:'🤖', src:'refine 500 🚀 total',                    hint:'keep the refinery humming',        eff:'+25% refinery speed' },
  { id:'zib',    name:'Zib',                  e:'👽', src:'win your first expedition',             hint:'try Deep Space',                   eff:'+5% expedition success' },
  { id:'quark',  name:'Prof. Quark',          e:'🧑‍🔬', src:'Glacio Habitat level 10',              hint:'develop Glacio',                   eff:'colony: +25% output', slot:'col' },
  { id:'wrench', name:'Wrench',               e:'🦾', src:'repair 3 wrecked ships',                hint:'brave the dangerous tiers',        eff:'repairs half price & half time' },
  { id:'inky',   name:'Inky',                 e:'🐙', src:'complete 5 Comet Tail Runs',            hint:'chase comets',                     eff:'ship: +20% cargo', slot:'ship' },
  { id:'chef',   name:'Chef Nebula',          e:'👩‍🍳', src:'50 total Habitat levels',              hint:'build Habitats everywhere',        eff:'colony: +20% output', slot:'col' },
  { id:'umbral', name:'Agent Umbra',          e:'🕵️', src:'trade 1M ⭐ volume on the market',       hint:'play the Galactic Market',         eff:'+8% market sell prices' },
  { id:'sam',    name:'Stardust Sam',         e:'🧙', src:'Pirate Belt expedition drop',           hint:'raid the Pirate Belt',             eff:'+10% expedition payouts' },
  { id:'gravity',name:'Count Gravity',        e:'🧛', src:'Black Hole Rim expedition drop',        hint:'skirt the Black Hole',             eff:'1 free expedition re-roll a day' },
  { id:'luna',   name:'Luna the Star Unicorn',e:'🦄', src:'The Void expedition drop',              hint:'survive The Void',                 eff:'+15% ALL income' },
];
const cDef = id => CREW.find(c => c.id === id);

const ARTIFACTS = [
  { id:'eye',     name:'Eye of Andromeda',        e:'🧿', src:'make 100 market trades',        eff:'the market shows its next move' },
  { id:'horn',    name:'Horn of the Comet',       e:'🎺', src:'Asteroid Maze expedition drop', eff:'missions −10% time' },

function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (Math.floor(n * 10) / 10).toString().replace(/\.0$/, '');
  const SUF = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i = -1, v = n;
  while (v >= 1000 && i < SUF.length - 1){ v /= 1000; i++; }
  if (v >= 1000) return n.toExponential(2);
  return (v >= 100 ? Math.floor(v) : Math.floor(v * 10) / 10) + SUF[i];
}
const fC = n => fmt(n) + ' ⭐', fO = n => fmt(n) + ' ⛏️', fI = n => fmt(n) + ' 🧊', fF = n => fmt(n) + ' 🚀';
function parseAmount(s){
  s = String(s).trim().replace(/[$,\s]/g, '');
  if (!s) return null;
  const m = s.match(/^([\d.]+)([a-zA-Z]+)$/);
  if (m){
    const SUF = { k:1e3, m:1e6, b:1e9, t:1e12, qa:1e15, qi:1e18, sx:1e21, sp:1e24, oc:1e27, no:1e30, dc:1e33 };
    const mult = SUF[m[2].toLowerCase()];
    if (mult === undefined) return null;
    const v = parseFloat(m[1]); return isFinite(v) ? v * mult : null;
  }
  return isFinite(+s) ? +s : null;
}
function fmtTime(ms){
  const s = Math.ceil(ms / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60 ? (s % 60) + 's' : '');
  if (s < 86400) return Math.floor(s / 3600) + 'h ' + (Math.floor(s / 60) % 60) + 'm';
  return Math.floor(s / 86400) + 'd ' + (Math.floor(s / 3600) % 24) + 'h';
}
function timeAgo(t){
  const d = Date.now() - (t || 0);
  if (d < 90e3) return 'just now';
  if (d < 3600e3) return Math.floor(d / 60e3) + 'm ago';
  if (d < 86400e3) return Math.floor(d / 3600e3) + 'h ago';
  return Math.floor(d / 86400e3) + 'd ago';
}

/* ============================ game loop ================================== */
let comboT = 0; // ms since last tap
function tick(dt){ // dt ms
  if (!S) return;
  // an expedition report doesn't wait for you to be watching
  if (S.exp && S.exp.state === 'flying' && Date.now() >= S.exp.until) resolveExpedition(false);
  // combo decay
  comboT += dt;
  if (comboT > 1000 && (S.comboV || 0) > 0) S.comboV = Math.max(0, S.comboV - dt / 1500);
  // auto-miner drone
  if (hasTech('drone')){
    S.droneT = (S.droneT || 0) + dt;
    while (S.droneT >= 1000){ S.droneT -= 1000; S.ore += S.laser * (hasTech('laser1') ? 2 : 1) * (hasTech('laser2') ? 4 : 1) * allProdMult(); }
  }
  // refinery: fully automatic — converts whenever materials are on hand
  if (refUnlocked() && S.ore >= REF_IN.ore && S.ice >= REF_IN.ice){
    S.refT += dt;
    const bt = refBatchTime();
    while (S.refT >= bt && S.ore >= REF_IN.ore && S.ice >= REF_IN.ice){
      S.refT -= bt;
      S.ore -= REF_IN.ore; S.ice -= REF_IN.ice;
      S.fuel += refOut(); S.n.refined += refOut();
    }
  } else S.refT = 0;
  // colonies produce into silos
  for (const pid in S.colonies){
    const c = S.colonies[pid], rates = colonyRates(pid), cap = siloCap(pid);
    let total = 0; for (const r in c.stored) total += c.stored[r];
    for (const r in rates){
      if (total >= cap) break;
      const add = Math.min(rates[r] * dt / 1000, cap - total);
      c.stored[r] = (c.stored[r] || 0) + add; total += add;
    }
    if (hasTech('robo') && total >= cap * 0.999) collectSiloQuiet(pid);
    // survey milestones
    const tl = colonyTotalLvl(pid);
    c.mile = c.mile || [];
    MILESTONES.forEach((m, i) => {
      if (tl >= m && !c.mile[i]){
        c.mile[i] = true;
        const p = pDef(pid);
        if (i === 0){ S.fuel += p.cost.f * 3; showNotice('🎖️', p.name + ' survey complete!', 'Found a fuel cache: +' + fmt(p.cost.f * 3) + ' 🚀'); }
        if (i === 1){ const cr = p.cost.c * 2; S.credits += cr; S.lifetime += cr; showNotice('🎖️', p.name + ' deep survey!', 'Treasure: +' + fC(cr)); }
        if (i === 2){ showNotice('🎖️', p.name + ' fully surveyed!', 'This colony now produces +25% forever.'); }
        save();
      }
    });
  }
  checkUnlocks();
}
function collectSiloQuiet(pid){ const c = S.colonies[pid]; for (const r in c.stored){ const v = Math.floor(c.stored[r]); if (v > 0) grant({ [r]: v }); } c.stored = {}; }
function resolveOffline(){
  const away = Date.now() - (S.last || Date.now());
  if (away < 30e3) return null;
  const gains = { credits: 0, ore: 0, ice: 0, fuel: 0 };
  // silos fill to cap
  for (const pid in S.colonies){
    const c = S.colonies[pid], rates = colonyRates(pid), cap = siloCap(pid);
    let total = 0; for (const r in c.stored) total += c.stored[r];
    for (const r in rates){
      const add = Math.min(rates[r] * away / 1000, Math.max(0, cap - total));
      c.stored[r] = (c.stored[r] || 0) + add; total += add;
    }
  }
  // refinery: auto-converts offline too, bounded by materials on hand
  if (refUnlocked()){
    const possible = Math.floor((away + S.refT) / refBatchTime());
    const byMats = Math.min(Math.floor(S.ore / REF_IN.ore), Math.floor(S.ice / REF_IN.ice));
    const done = Math.max(0, Math.min(possible, byMats));
    if (done > 0){
      S.ore -= done * REF_IN.ore; S.ice -= done * REF_IN.ice;
      const f = done * refOut();
      S.fuel += f; S.n.refined += f; gains.fuel += f;
    }
  }
  // missions: complete; with Auto-Relaunch, run repeat cycles up to a queue cap
  const capMs = hasTech('deep') ? 24 * 3600e3 : 8 * 3600e3;
  for (const sid in S.ships){
    const st = S.ships[sid];
    if (!st.mis) continue;
    if (Date.now() >= st.mis.until){
      const mid = st.mis.type;
      let runs = 1;
      if (hasTech('auto')){
        const extra = Math.floor(Math.min(away, capMs) / missionTime(mid, sid));
        runs = Math.max(1, extra);
      }
      const per = missionRewards(mid, sid);
      for (const r in per) gains[r] = (gains[r] || 0) + per[r] * runs;
      for (const r in per) grant({ [r]: per[r] * runs });
      if (mid === 'moonhop') S.n.moonhops += runs;
      if (mid === 'comet') S.n.cometruns += runs;
      if (hasTech('auto') && S.fuel >= mDef(mid).fuel){ S.fuel -= mDef(mid).fuel; st.mis = { type: mid, until: Date.now() + missionTime(mid, sid) }; }
      else st.mis = null;
    }
  }
  // in-flight expedition: resolve current stage, auto-bank on success
  if (S.exp && Date.now() >= S.exp.until) resolveExpedition(true);
  return gains;
}

async function quickSell(res){
  const amount = Math.floor(S[res]);
  if (amount < 1) return;
  if (serverOn && onlineCreds){
    try {
      const r = await api('/api/market/trade', { method: 'POST', body: JSON.stringify({ ...onlineCreds, res, dir: 'sell', amount }) });
      let credits = r.credits;
      if (hasCrew('umbral')) credits = Math.floor(credits * 1.08);
      S[res] -= amount; S.credits += credits; S.lifetime += credits;
      S.n.marketvol += credits; S.n.trades++;
      toast('+' + fC(credits));
      checkUnlocks(); paint(); save();
      return;
    } catch {}
  }
  // guest / offline: sell locally at base price
  const credits = Math.floor(amount * MARKET_BASE[res] * (hasCrew('umbral') ? 1.08 : 1));
  S[res] -= amount; S.credits += credits; S.lifetime += credits;
  S.n.marketvol += credits; S.n.trades++;
  toast('+' + fC(credits));
  checkUnlocks(); paint(); save();
}
function sendAllShips(){ // one button: every idle ship flies the biggest mission it can fuel
  let sent = 0;
  const idle = Object.keys(S.ships).filter(sid => !S.ships[sid].mis && !(S.ships[sid].wreck && Date.now() < S.ships[sid].wreck));
  const byFuel = MISSIONS.filter(m => colonyCount() >= m.need).sort((a, b) => b.fuel - a.fuel);
  for (const sid of idle){
    if (Object.values(S.ships).filter(x => x.mis).length >= hangarSlots()) break;
    const m = byFuel.find(x => S.fuel >= x.fuel);
    if (!m) break;
    S.fuel -= m.fuel;
    S.ships[sid].mis = { type: m.id, until: Date.now() + missionTime(m.id, sid) };
    sent++;
  }
  if (sent) toast('🚀 ' + sent + (sent === 1 ? ' ship' : ' ships') + ' launched!');
  else alert('No ships could launch — check your fuel, or wait for ships to come home.');
  paint(); save();
}

function launchMission(sid, mid){
  const st = S.ships[sid], m = mDef(mid);
  if (!st || st.mis || (st.wreck && Date.now() < st.wreck)) return;
  const flying = Object.values(S.ships).filter(x => x.mis).length;
  if (flying >= hangarSlots()){ alert('All hangar slots are busy — wait for a ship to come home (or unlock more bays in the tech tree).'); return; }
  if (S.fuel < m.fuel){ alert(`Not enough fuel — this mission needs ${fmt(m.fuel)} 🚀. Refine some in the Command tab!`); return; }
  S.fuel -= m.fuel;
  st.mis = { type: mid, until: Date.now() + missionTime(mid, sid) };
  paint(); save();
}
function collectMission(sid){
  const st = S.ships[sid];
  if (!st.mis || Date.now() < st.mis.until) return;
  const mid = st.mis.type, rw = missionRewards(mid, sid);
  grant(rw);
  if (mid === 'moonhop') S.n.moonhops++;
  if (mid === 'comet') S.n.cometruns++;
  if (mid === 'edge'){
    const c = dropChance(mDef('edge').artP, 'edge');
    if (!hasArt('monolith') && Math.random() < c) unlockArt('monolith', 'It was just… floating there. Whispering.');
    else S.pity.edge = (S.pity.edge || 0) + 0.02;
  }
  st.mis = null;
  if (hasTech('auto') && S.fuel >= mDef(mid).fuel){ S.fuel -= mDef(mid).fuel; st.mis = { type: mid, until: Date.now() + missionTime(mid, sid) }; }
  const rews = Object.entries(rw).map(([r, v]) => fmt(v) + ({ ore:' ⛏️', ice:' 🧊', credits:' ⭐' }[r])).join(' + ');
  toast('📦 ' + rews);
  checkUnlocks();
  paint(); save();
}
function toast(text){
  const f = document.createElement('div');
  f.className = 'floater';
  f.style.left = '50%'; f.style.top = '40%'; f.style.transform = 'translateX(-50%)'; f.style.fontSize = '1.1rem'; f.style.color = 'var(--good)';
  f.textContent = text;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

    : `<h3>🔧 Repair bay</h3><p class="dim">All ships shipshape. 🫡</p>`;
}
function canReroll(){ return hasCrew('gravity') && Date.now() - (S.n.rerollAt || 0) > 20 * 3600e3; }
function resolveExpedition(silent){
  const e = S.exp, t = TIERS[e.tier];
  const win = Math.random() < expP(e.tier);
  if (win){
    S.streak = e.stage; S.n.expwins++;
    if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    unlockCrew('zib', 'Your first expedition win — Zib beams aboard!') // no-op if owned
    // rare drops with pity
    let dropped = false;
    for (const [kind, id, base] of (t.drops || [])){
      if ((kind === 'crew' && hasCrew(id)) || (kind === 'art' && hasArt(id))) continue;
      if (Math.random() < dropChance(base, e.tier)){
        if (kind === 'crew') unlockCrew(id); else unlockArt(id);
        S.pity[e.tier] = 0; dropped = true; break;
      }
    }
    if (!dropped) S.pity[e.tier] = (S.pity[e.tier] || 0) + 0.02;
    if (silent){ bankExpedition(true); return; }
    e.state = 'choice';
    paint(); save(); if (visible('deep')) paintDeep();
    return;
  }
  // failure
  if (canReroll() && !silent && confirm('💀 The expedition failed… but Count Gravity bends time! Use your free daily re-roll?')){
    S.n.rerollAt = Date.now();
    e.until = Date.now() + 1000; // instant re-fly of the same stage
    save(); paintDeep();
    return;
  }
  let msg = '💀 The expedition was lost — the pot is gone.';
  if (hasArt('mirror') && Math.random() < 0.25){
    const pay = expPayout(e.pot);
    grant(pay);
    msg = '🪞 The Mirror of Maybe flickers… your cargo made it home anyway! +' + fC(pay.credits);
  } else if (hasTech('insure')){
    const back = Math.ceil(e.stake / 2);
    S.fuel += back;
    msg += ` Salvage Insurance recovered ${fmt(back)} 🚀.`;
  }
  if (t.wreck){
    const cost = Math.ceil(sDef(e.ship).cost * 0.25 * (hasCrew('wrench') ? 0.5 : 1));
    const time = 5 * 60e3 * (e.tier + 1) * (hasCrew('wrench') ? 0.5 : 1);
    S.ships[e.ship].wreck = Date.now() + time;
    if (cost > 0){ S.credits = Math.max(0, S.credits - cost); }
    S.n.repairs++;
    msg += ` ${sDef(e.ship).e} was wrecked — repairs cost ${fC(cost)} and take ${fmtTime(time)}.`;
  }
  S.streak = 0; S.exp = null;
  checkUnlocks();
  paint(); save();
  if (!silent) showNotice('💥', 'Expedition failed', esc(msg));
  if (visible('deep')) paintDeep();
}
function bankExpedition(silent){
  const e = S.exp, pay = expPayout(e.pot);
  grant(pay);
  S.exp = null;
  paint(); save();
  if (!silent) showNotice('🎉', 'Expedition banked!', `You brought home <b>${fC(pay.credits)}</b> + <b>${fO(pay.ore)}</b>${e.stage > 1 ? ` after a ${e.stage}-stage streak!` : '.'}`);
  if (visible('deep')) paintDeep();
}

async function marketTrade(res, dir){
  if (!S) return;
  if (!serverOn || !onlineCreds){ alert('The Galactic Market needs an online account.'); return; }
  const have = dir === 'sell' ? Math.floor(S[res]) : Math.floor(S.credits);
  const label = { ore:'⛏️ Ore', ice:'🧊 Ice' }[res];
  const q = dir === 'sell' ? `Sell how much ${label}? (you have ${fmt(have)} — suffixes like 5m work, or "max")`
                           : `Buy how much ${label}? (you have ${fC(S.credits)})`;
  const raw = (prompt(q) || '').trim();
  if (!raw) return;
  let amount = raw.toLowerCase() === 'max' && dir === 'sell' ? have : Math.floor(parseAmount(raw) || 0);
  if (amount <= 0) return;
  if (dir === 'sell' && amount > S[res]){ alert(`You only have ${fmt(Math.floor(S[res]))} ${label}.`); return; }
  try {
    const r = await api('/api/market/trade', { method: 'POST', body: JSON.stringify({ ...onlineCreds, res, dir, amount }) });
    let credits = r.credits;
    if (dir === 'sell'){
      if (hasCrew('umbral')) credits = Math.floor(credits * 1.08);
      if (S[res] < amount) amount = Math.floor(S[res]); // settle safely
      S[res] -= amount; S.credits += credits; S.lifetime += credits;
      toast(`+${fC(credits)}`);
    } else {
      if (S.credits < credits){ alert(`That costs ${fC(credits)} — too rich for us right now.`); return; }
      S.credits -= credits; S[res] += amount;
      toast(`+${fmt(amount)} ${label}`);
    }
    S.n.marketvol += credits; S.n.trades++;
    checkUnlocks();
    paint(); save(); syncTick();
  } catch { alert('Could not reach the exchange — try again in a moment.'); }
}

const SYNC_URL = 'https://hardwood-tycoon.up.railway.app';
const OWNER_ACCOUNTS = ['owner', 'owners alt'];
let serverOn = false, apiBase = null, onlineCreds = null, loadedVersion = null, iAmBlocked = false, manualAnnounce = null;
async function api(path, opts = {}){
  if (apiBase === null) throw new Error('no server');
  const r = await fetch(apiBase + path, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
  if (!r.ok) throw Object.assign(new Error('server error ' + r.status), { status: r.status });
  return r.json();
}
async function checkServer(){
  const candidates = [];
  if (location.protocol.startsWith('http')) candidates.push('');
  if (SYNC_URL) candidates.push(SYNC_URL.replace(/\/+$/, ''));
  for (const c of candidates){
    try {
      const r = await fetch(c + '/api/ping');
      if (r.ok){
        const j = await r.json();
        // must be THIS game's server — protects the cutover window
        if (j.ok === true && j.game === 'space-tycoon'){
          apiBase = c; serverOn = true;
          if (loadedVersion === null && j.version != null) loadedVersion = j.version;
          return true;
        }
      }
    } catch {}
  }
  apiBase = null; serverOn = false;
  return false;
}
function forceReload(){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><div style="font-size:2.4rem">🛸</div><h2>New version incoming!</h2><p class="dim">The galaxy just got an upgrade — reloading…</p></div>`;

}

function applyServerFlags(r){
  let touched = false; const msgs = [];

    if (isFinite(c.give) && c.give > 0){ S.credits += c.give; touched = true; }
    if (c.reset === true){
      const keep = { crew: S.crew, artifacts: S.artifacts, tech: S.tech, dm: S.dm, dmEarned: S.dmEarned, seenWelcome: S.seenWelcome, chatRead: S.chatRead };
      S = { ...freshState(), ...keep };
      renderAll(); touched = true;
    }
    if (typeof c.message === 'string' && c.message) msgs.push(c.message);
    if (c.set){ for (const k in c.set) S[k] = c.set[k]; touched = true; }
  }
  if (typeof r.blocked === 'boolean') iAmBlocked = r.blocked;
  if (touched){ paint(); save(); }
  if (msgs.length) showNotice('💬', 'Message from the owner', msgs.map(esc).join('<hr style="border:none;border-top:1px solid var(--line);margin:10px 0">'));

async function syncTick(){

      if (loadedVersion !== null && lb.version != null && lb.version !== loadedVersion){

        else if (S) save();

async function chatSend(other, text){

    modal.innerHTML = `
      <div style="font-size:2.6rem">🚀</div>
      <h2>Galaxy Tycoon</h2>
      <p class="dim">Mine asteroids, launch rockets, own the galaxy.</p>
      <div class="btncol">
        ${names.map((n, i) => `<button class="primary" data-sess="${i}">Continue as ${esc(n)}</button>`).join('')}
        <button class="${names.length ? 'ghost' : 'primary'}" id="newacct">Create account</button>
        <button class="ghost" id="loginbtn">Log in</button>
        ${guestBlock}
      </div>
      <p class="fineprint" id="formerr" style="color:var(--bad)"></p>`;
    modal.querySelectorAll('[data-sess]').forEach(b => b.addEventListener('click', async () => {
      const n = names[+b.dataset.sess];
      try {
        const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ name: n, pin: sess[n] }) });
        beginOnline(n, sess[n], r.save);
      } catch { forgetSession(n); menu(); }
    }));
    modal.querySelector('#newacct').addEventListener('click', createForm);
    modal.querySelector('#loginbtn').addEventListener('click', () => loginForm());
    modal.querySelector('#guest').addEventListener('click', () => begin(null));
  }
  function createForm(){
    modal.innerHTML = `
      <div style="font-size:2.6rem">🧑‍🚀</div>
      <h2>Create your account</h2>
      <p class="dim">Pick a name and a PIN — your empire will follow you on any device.</p>
      <input id="f-name" maxlength="20" placeholder="Your name" autocomplete="off">
      <input id="f-pin" maxlength="30" placeholder="PIN (4+ characters)" autocomplete="off">
      <p class="fineprint" id="formerr" style="color:var(--bad)"></p>
      <div class="btncol"><button class="primary" id="go">🚀 Blast off</button><button class="ghost" id="back">Back</button></div>`;
    const name = modal.querySelector('#f-name'), pin = modal.querySelector('#f-pin');
    const go = async () => {
      const n = (name.value || '').trim().slice(0, 20);
      if (!n) return err('Pick a name first.');
      if (!nameOk(n)) return err("That name isn't allowed — keep it clean and pick another.");
      if ((pin.value || '').length < 4) return err('PIN must be at least 4 characters.');
      const headers = {};
      if (OWNER_ACCOUNTS.includes(n)){
        const k = prompt('That name is reserved for the owner. Owner passcode:') || '';
        if (!k) return err('That name is reserved for the owner.');
        headers['x-admin-key'] = k;
      }
      try {
        const r = await api('/api/signup', { method: 'POST', headers, body: JSON.stringify({ name: n, pin: pin.value, device: deviceId() }) });
        beginOnline(n, pin.value, r.save);
        welcomeModal();
      } catch (e) { err(e.status === 409 ? 'That name is taken — log in instead.' : e.status === 403 ? (OWNER_ACCOUNTS.includes(n) ? 'Wrong owner passcode.' : 'This device already has 2 accounts — log in to one instead.') : 'Could not reach the server.'); }
    };
    modal.querySelector('#go').addEventListener('click', go);
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    modal.querySelector('#back').addEventListener('click', menu);
    name.focus();
  }
  function loginForm(prefill){
    modal.innerHTML = `
      <div style="font-size:2.6rem">🚀</div>
      <h2>Log in</h2>
      <input id="f-name" maxlength="20" placeholder="Your name" autocomplete="off" value="${esc(prefill || '')}">
      <input id="f-pin" maxlength="30" placeholder="PIN" autocomplete="off">
      <p class="fineprint" id="formerr" style="color:var(--bad)"></p>
      <div class="btncol"><button class="primary" id="go">Log in</button><button class="ghost" id="back">Back</button></div>`;
    const name = modal.querySelector('#f-name'), pin = modal.querySelector('#f-pin');
    const go = async () => {
      const n = (name.value || '').trim().slice(0, 20);
      if (!n || !pin.value) return err('Enter your name and PIN.');
      try {
        const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ name: n, pin: pin.value }) });
        beginOnline(n, pin.value, r.save);
      } catch (e) { err(e.status === 401 ? 'Wrong name or PIN.' : 'Could not reach the server.'); }
    };
    modal.querySelector('#go').addEventListener('click', go);
    pin.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    modal.querySelector('#back').addEventListener('click', menu);
    (prefill ? pin : name).focus();
  }
  function menuLocal(){
    const list = accounts();
    modal.innerHTML = `
      <div style="font-size:2.6rem">🚀</div>
      <h2>Galaxy Tycoon</h2>
      <p class="dim">Offline mode — accounts live in this browser only.</p>
      <div class="btncol">
        ${list.map((n, i) => `<button class="primary" data-acct="${i}">Continue as ${esc(n)}</button>`).join('')}
        <button class="${list.length ? 'ghost' : 'primary'}" id="newacct">Create account</button>
        ${guestBlock}
      </div>`;
    modal.querySelectorAll('[data-acct]').forEach(b => b.addEventListener('click', () => begin(accounts()[+b.dataset.acct])));
    modal.querySelector('#newacct').addEventListener('click', createLocal);
    modal.querySelector('#guest').addEventListener('click', () => begin(null));
  }
  function createLocal(){
    modal.innerHTML = `
      <div style="font-size:2.6rem">🧑‍🚀</div>
      <h2>Create account</h2>
      <input id="acctname" maxlength="20" placeholder="Your name" autocomplete="off">
      <div class="btncol"><button class="primary" id="go">🚀 Blast off</button><button class="ghost" id="back">Back</button></div>`;
    const inp = modal.querySelector('#acctname');
    const go = () => { const n = createAccount(inp.value); if (n){ begin(n); welcomeModal(); } else inp.focus(); };
    modal.querySelector('#go').addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    modal.querySelector('#back').addEventListener('click', menuLocal);
    inp.focus();
  }
  if (mode === 'create' && serverOn) createForm(); else if (mode === 'create') createLocal(); else menu();
  document.body.appendChild(ov);
}
function createAccount(name){
  name = (name || '').trim().slice(0, 20);
  if (!name) return null;
  if (!nameOk(name)){ alert("That name isn't allowed — keep it clean and pick another."); return null; }
  const list = accounts();
  if (!list.includes(name)){
    if (list.length >= 2){ alert('You can only have 2 accounts on this device.'); return null; }
    list.push(name); saveAccounts(list);
  }
  return name;
}
function messageOwnerModal(){
  el('acctdrop').style.display = 'none';
  if (!S) return;
  if (!serverOn){ alert('Messaging needs an internet connection.'); return; }
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">
    <div style="font-size:2.4rem">✉️</div>
    <h2>Message the owner</h2>
    <textarea id="msgtext" maxlength="500" rows="4" placeholder="Type your message…"></textarea>
    <div class="btncol"><button class="primary" id="msend">Send</button><button class="ghost" id="mcancel">Cancel</button></div></div>`;
  ov.querySelector('#mcancel').addEventListener('click', () => ov.remove());
  ov.querySelector('#msend').addEventListener('click', async () => {
    const text = ov.querySelector('#msgtext').value.trim();
    if (!text) return;
    try { await api('/api/message', { method: 'POST', body: JSON.stringify({ from: player || 'Guest', text }) }); ov.remove(); toast('✉️ Sent!'); }
    catch { alert('Could not reach the server.'); }
  });
  document.body.appendChild(ov);
}

/* ------------------------------- ticker ---------------------------------- */
let tickerIdx = 0;
function updateTicker(){
  const g = lbData && lbData.goal;
  const line = manualAnnounce ? '📣 ' + manualAnnounce
    : (goalBoostOn && Math.random() < 0.3) ? '🎉 GALAXY GOAL COMPLETE — everyone earns +25% ⭐ this week!'
    : (g && Math.random() < 0.25) ? `🤝 Galaxy Goal: ${g.text} — ${Math.min(100, g.donated / g.target * 100).toFixed(0)}% done!`
    : TICKER_LINES[tickerIdx++ % TICKER_LINES.length];
  el('ticker').textContent = line + '   ·   ' + (manualAnnounce ? '' : TICKER_LINES[brnd(0, TICKER_LINES.length - 1)]);
}
setInterval(updateTicker, 22000);

/* ------------------------------ tab wiring ------------------------------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  for (const sec of ['command', 'galaxy', 'deep', 'hub'])
    el('tab-' + sec).style.display = t.dataset.tab === sec ? '' : 'none';
  if (!S) return;
  if (t.dataset.tab === 'galaxy'){ paintGalaxy(); paintWormhole(); }
  if (t.dataset.tab === 'deep') paintDeep();
  if (t.dataset.tab === 'hub'){ chatOpen = null; renderHub(); chatFetch(); if (serverOn) api('/api/leaderboard').then(r => { lbData = r; goalBoostOn = !!(r.goal && r.goal.boost); renderHub(); }).catch(() => {}); }
}));

/* ------------------------------ wiring ----------------------------------- */
el('tap').addEventListener('click', tap);
window.addEventListener('keydown', ev => {
  if (ev.code !== 'Space' || ev.repeat) return;
  const t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.tagName === 'BUTTON')) return;
  ev.preventDefault(); tap();
});
el('laserup').addEventListener('click', () => { if (S && S.credits >= laserCost()){ S.credits -= laserCost(); S.laser++; paint(); save(); } });
el('acctmenu').addEventListener('click', () => { const d = el('acctdrop'); d.style.display = d.style.display === 'none' ? '' : 'none'; });
document.addEventListener('click', e => { if (!e.target.closest('.acctwrap')) el('acctdrop').style.display = 'none'; });
el('messagebtn').addEventListener('click', messageOwnerModal);
el('tutorialbtn').addEventListener('click', () => { el('acctdrop').style.display = 'none'; if (S) startTutorial(); });
el('logoutbtn').addEventListener('click', () => { el('acctdrop').style.display = 'none'; leaveGame(); });
el('newacctbtn').addEventListener('click', () => { el('acctdrop').style.display = 'none'; leaveGame('create'); });
el('adminbtn').addEventListener('click', openAdmin);
el('renamebtn').addEventListener('click', async () => {
  el('acctdrop').style.display = 'none';
  if (!S || !player) return;
  const n = (prompt(`New name for ${player}?`, player) || '').trim().slice(0, 20);
  if (!n || n === player) return;
  if (!nameOk(n)){ alert("That name isn't allowed — keep it clean and pick another."); return; }
  if (onlineCreds){
    try {
      await api('/api/rename', { method: 'POST', body: JSON.stringify({ ...onlineCreds, newName: n }) });
      forgetSession(player); rememberSession(n, onlineCreds.pin);
      onlineCreds = { ...onlineCreds, name: n };
      player = n;
      updateAcctUI(); paint();
    } catch (e) { alert(e.status === 409 ? `"${n}" is already taken.` : e.status === 400 ? "That name isn't allowed." : e.status === 403 ? 'That name is reserved.' : 'Could not reach the server.'); }
    return;
  }
  if (accounts().includes(n)){ alert(`"${n}" is already taken.`); return; }
  saveAccounts(accounts().map(x => x === player ? n : x));
  try {
    const raw = localStorage.getItem(acctKey(player));
    if (raw !== null) localStorage.setItem(acctKey(n), raw);
    localStorage.removeItem(acctKey(player));
  } catch {}
  player = n;
  save(); updateAcctUI(); paint();
});
el('hardreset').addEventListener('click', () => {
  if (!S) return;
  if (!confirm('Reset your WHOLE empire — credits, planets, ships, everything? (Crew, artifacts, tech and dark matter survive.)')) return;
  if (!confirm('Really? This cannot be undone.')) return;
  const keep = { crew: S.crew, artifacts: S.artifacts, tech: S.tech, dm: S.dm, dmEarned: S.dmEarned, n: S.n, bestStreak: S.bestStreak, seenWelcome: S.seenWelcome, chatRead: S.chatRead };
  S = { ...freshState(), ...keep };
  save(); renderAll();
});
el('deleteacct').addEventListener('click', async () => {
  if (!S || !player) return;
  if (!confirm(`Delete the account "${player}" FOREVER? Everything goes — credits, planets, crew, dark matter, chats, leaderboard spots. This cannot be undone.`)) return;
  const typed = (prompt(`Type your account name (${player}) to confirm:`) || '').trim();
  if (typed !== player){ if (typed) alert("That didn't match — your account is safe."); return; }
  if (onlineCreds && serverOn){
    try { await api('/api/account/delete', { method: 'POST', body: JSON.stringify({ ...onlineCreds }) }); }
    catch (e) {
      alert(e.status === 403 ? "The owner account can't be deleted from in the game." : 'Could not reach the server — your account was NOT deleted.');
      return;
    }
  }
  forgetSession(player);
  try { localStorage.removeItem(acctKey(player)); } catch {}
  saveAccounts(accounts().filter(x => x !== player));
  S = null; player = null; onlineCreds = null;
  alert('Your account has been deleted. Fly safe, cadet. 🫡');
  showStart();
});

/* ------------------------------- loops ----------------------------------- */
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(2000, now - lastTick);
  lastTick = now;
  if (S){ tick(dt); paint(); }
}, 250);
setInterval(save, 5000);
setInterval(syncTick, 30000);
setInterval(() => { if (visible('hub') && S) chatFetch(); }, 6000);
document.addEventListener('visibilitychange', () => { if (document.hidden){ save(); syncTick(); } });
window.addEventListener('beforeunload', save);
checkServer().then(() => { syncTick(); showStart(); updateTicker(); });
</script>
</body>
</html>
